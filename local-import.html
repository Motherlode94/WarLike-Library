<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WarLike Library — MCP Local</title><style>body{font:16px system-ui;max-width:900px;margin:3rem auto;padding:0 1rem;background:#171b20;color:#eee}a{color:#9ec9ff}button,input{font:inherit}li{overflow-wrap:anywhere}#status{white-space:pre-wrap}</style><main><a href="./">← Library</a><h1>Importer un paquet MCP Local</h1><p>Vérification des fichiers, empreintes et métadonnées avant ajout local. Aucun envoi automatique vers un serveur. Les licences déclarées ne sont pas vérifiées juridiquement.</p><input id="file" type="file" accept=".json,application/json"><p id="status" role="status">Sélectionne le paquet exporté par l'agent local.</p><ul id="preview"></ul><label><input id="rights" type="checkbox"> Je dispose des droits nécessaires à cet usage.</label><p><button id="commit" disabled>Ajouter à ma Library</button></p></main><script type="module">
import {openStore,readAll,writeMany} from './js/storage.js';import {parseLocalPack,planLocalImport} from './js/local-transfer.js';
const $=id=>document.getElementById(id);let records=null,busy=false,epoch=0;const refresh=()=>{$('commit').disabled=busy||!records||!$('rights').checked};$('rights').onchange=refresh;
$('file').onchange=async()=>{const n=++epoch;records=null;$('preview').replaceChildren();$('rights').checked=false;refresh();const f=$('file').files[0];if(!f)return;try{if(f.size>29*1024*1024)throw Error('Paquet trop volumineux');const r=await parseLocalPack(JSON.parse(await f.text()));if(n!==epoch)return;records=r;for(const a of r){const li=document.createElement('li');li.textContent=a.relativePath+' · '+a.license;$('preview').append(li)}$('status').textContent=r.length+' fichiers vérifiés, à confirmer.';}catch(e){if(n===epoch)$('status').textContent=e.message}finally{refresh()}};
$('commit').onclick=async()=>{if(busy||!records||!$('rights').checked)return;busy=true;$('file').disabled=true;refresh();try{await openStore();const plan=planLocalImport(records,await readAll());if(plan.added.length)await writeMany(plan.added);$('status').textContent=plan.added.length+' ajoutés, '+plan.skipped.length+' doublons ignorés. Ouvre Library.';records=null;}catch(e){$('status').textContent=e.message}finally{busy=false;$('file').disabled=false;refresh()}};
</script></html>
